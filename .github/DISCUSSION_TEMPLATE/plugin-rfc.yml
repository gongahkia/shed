title: "[Plugin RFC]: "
labels:
  - plugin-rfc
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What plugin or extension point is being proposed?
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Contract
      description: Protocols, DSL primitives, IPC events, or ABI assumptions involved.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility
      description: Versioning, migration, signing, sandboxing, and performance constraints.
    validations:
      required: true
  - type: input
    id: northstar
    attributes:
      label: NORTHSTAR refs
      description: "Example: ref:N§4-D4, ref:N§14."
    validations:
      required: true
