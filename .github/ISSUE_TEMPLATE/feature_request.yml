name: Feature request
description: Propose a scoped product or engineering change.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or constraint does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: input
    id: northstar
    attributes:
      label: NORTHSTAR refs
      description: "Example: ref:N§5, ref:N§12a."
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Tradeoffs
      description: Performance, AX, private API, safe-zone, or ecosystem risks.
    validations:
      required: false
