name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  build-test:
    name: Build and test
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build release
        run: swift build -c release
      - name: Test
        run: swift test

  lint:
    name: Lint
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install lint tools
        run: brew install swiftlint swiftformat
      - name: SwiftLint
        run: swiftlint lint --config .swiftlint.yml --strict
      - name: SwiftFormat
        run: swiftformat --lint .
