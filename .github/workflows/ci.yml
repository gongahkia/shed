name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-${{ runner.arch }}-spm-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-spm-
      - name: Install hyperfine
        run: brew install hyperfine
      - name: Build release
        run: swift build -c release
      - name: Test
        run: swift test
      - name: Bench smoke
        run: .build/release/PicoBench --smoke --runs 1
      - name: Regression bench
        if: github.event_name == 'pull_request'
        run: bench/scripts/regression.sh
