name: Shed CI/CD on push

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run tests
        run: mvn -B -q test

      - name: Build jar
        run: mvn -B -q -DskipTests "-Dshed.build.commit=${{ github.sha }}" package

      - name: Verify jar artifact
        shell: pwsh
        run: |
          $jar = Join-Path $PWD 'target/shed-2.0.0.jar'
          if (-not (Test-Path -LiteralPath $jar -PathType Leaf)) { throw "Missing artifact: $jar" }
          $entries = & jar tf $jar
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect jar contents' }
          if ($entries -notcontains 'assets/hackregfont.ttf') { throw 'Missing bundled font resource' }
          $verificationDirectory = Join-Path $env:RUNNER_TEMP 'shed-jar-verification'
          New-Item -ItemType Directory -Path $verificationDirectory -Force | Out-Null
          Push-Location $verificationDirectory
          try {
            & jar xf $jar META-INF/MANIFEST.MF
            if ($LASTEXITCODE -ne 0) { throw 'Could not extract jar manifest' }
            if (-not (Select-String -Path 'META-INF/MANIFEST.MF' -SimpleMatch 'Main-Class: shed.Texteditor' -Quiet)) { throw 'Missing Shed main class' }
            if (-not (Select-String -Path 'META-INF/MANIFEST.MF' -SimpleMatch 'Implementation-Version: 2.0.0' -Quiet)) { throw 'Missing Shed version metadata' }
            if (-not (Select-String -Path 'META-INF/MANIFEST.MF' -SimpleMatch 'Shed-Build-Java: 21' -Quiet)) { throw 'Missing Shed Java build metadata' }
            if (-not (Select-String -Path 'META-INF/MANIFEST.MF' -SimpleMatch 'Shed-Commit: ${{ github.sha }}' -Quiet)) { throw 'Missing Shed commit metadata' }
          } finally {
            Pop-Location
          }

      - name: Build macOS installer
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          SHED_BUILD_COMMIT: ${{ github.sha }}
        run: bash scripts/package-macos.sh

      - name: Build Windows installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          SHED_BUILD_COMMIT: ${{ github.sha }}
        run: ./scripts/package-windows.ps1

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: shed-jar-${{ matrix.os }}
          path: target/shed-2.0.0.jar
          if-no-files-found: error

      - name: Upload macOS installer artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: shed-macos-arm64-installer
          path: target/macos-package/dist/*
          if-no-files-found: error

      - name: Upload Windows installer artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: shed-windows-x64-installer
          path: target/windows-package/dist/*
          if-no-files-found: error
