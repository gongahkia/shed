name: CI

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - ".perf-baseline.json"
  pull_request:

jobs:
  build-test:
    name: Build and test
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check private API usage
        run: ./scripts/check-no-private-api.sh
      - name: Check production timer usage
        run: ./scripts/check-no-production-timers.sh
      - name: Build release
        run: swift build -c release
      - name: Test
        run: swift test

  lint:
    name: Lint
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install lint tools
        run: brew install swiftlint swiftformat
      - name: DSL doc comments
        run: ./scripts/check-dsl-doc-comments.rb
      - name: SwiftLint
        run: swiftlint lint --config .swiftlint.yml --strict
      - name: SwiftFormat
        run: swiftformat --lint .
