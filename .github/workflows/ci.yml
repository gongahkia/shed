name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Verify native dependencies
        run: scripts/verify_native_dependencies.sh
      - name: Test native dependency preflight
        run: scripts/test_native_dependency_preflight.sh
      - name: Test bootstrap CLI
        run: scripts/test_bootstrap.sh
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-${{ runner.arch }}-spm-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-spm-
      - name: Install hyperfine
        run: brew install hyperfine
      - name: Validate keymaps
        run: scripts/validate_keymaps.swift
      - name: Verify generated keymap docs
        run: |
          scripts/gen_keymap_docs.swift
          git diff --exit-code -- docs/keymap-reference.md
      - name: Build release
        run: swift build -c release
      - name: Strict concurrency
        run: scripts/strict_concurrency.sh
      - name: Test with coverage
        run: ITSY_COVERAGE_DATE=current ITSY_COVERAGE_GATE=1 bench/scripts/coverage.sh
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            bench/results/coverage-current.lcov
            bench/results/coverage-current.json
            bench/results/coverage-current.md
      - name: LSP smoke
        run: swift test --filter ItsyLSPSmokeTests
      - name: Canonical LSP matrix
        run: scripts/lsp_matrix.sh --artifacts .build/lsp-matrix
      - name: Upload LSP matrix artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lsp-matrix
          path: .build/lsp-matrix
      - name: UI snapshots
        run: swift test --filter ItsyUISnapshotTests
      - name: Install DAP adapters
        run: |
          debugpy_dir="$RUNNER_TEMP/debugpy"
          python3 -m pip install --target "$debugpy_dir" debugpy
          echo "PYTHONPATH=$debugpy_dir${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"
          if ! /usr/bin/xcrun --find lldb-dap >/dev/null 2>&1 && ! command -v lldb-dap >/dev/null 2>&1; then
            brew install llvm
            echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          fi
      - name: DAP smoke
        run: bench/scripts/dap_smoke.sh
      - name: Integration tests
        run: swift test --filter ItsyIntegrationTests
      - name: Bench smoke
        run: .build/release/ItsyBench --smoke --runs 1
      - name: Regression bench
        if: github.event_name == 'pull_request'
        run: bench/scripts/regression.sh
