name: Shed CI/CD on push

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run tests
        run: mvn -B -q test

      - name: Build jar
        run: mvn -B -q -DskipTests package

      - name: Verify jar artifact
        run: |
          test -f target/shed-2.0.0.jar
          unzip -p target/shed-2.0.0.jar META-INF/MANIFEST.MF | grep 'Main-Class: shed.Texteditor'
          jar tf target/shed-2.0.0.jar | grep 'assets/hackregfont.ttf'

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: shed-jar
          path: target/shed-2.0.0.jar
          if-no-files-found: error
