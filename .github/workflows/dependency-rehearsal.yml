name: Dependency Rehearsal

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Pinned baseline Git ref
        required: true
        type: string
      candidate_ref:
        description: Candidate Git ref containing reviewed dependency pins
        required: true
        type: string

jobs:
  rehearse:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Rehearse base and candidate dependency pins
        env:
          BASE_REF: ${{ inputs.base_ref }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
        run: scripts/dependency_rehearsal.sh --base "$BASE_REF" --candidate "$CANDIDATE_REF"
