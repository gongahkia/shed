name: dyld-audit

on:
  pull_request:
  push:
    branches: [main]

jobs:
  dyld-audit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release
        run: swift build -c release
      - name: Dyld audit warning gate
        continue-on-error: true
        run: bench/scripts/dyld_audit.sh
