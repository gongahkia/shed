name: Nightly Baseline

on:
  workflow_dispatch:
    inputs:
      runs:
        description: Runs per app
        required: false
        default: "3"
      only:
        description: App name filter from run_baseline.sh
        required: false
        default: "TextEdit"
      purge:
        description: Run sudo purge before each measurement
        required: false
        default: "0"
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: write

jobs:
  baseline:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Build release
        run: swift build -c release
      - name: Run baseline
        run: |
          runs="${{ inputs.runs }}"
          only="${{ inputs.only }}"
          purge="${{ inputs.purge }}"
          if [[ -z "$runs" ]]; then runs="3"; fi
          if [[ -z "$only" ]]; then only="TextEdit"; fi
          if [[ -z "$purge" ]]; then purge="0"; fi
          RUNS="$runs" ITSY_BASELINE_ONLY="$only" ITSY_BASELINE_PURGE="$purge" bench/scripts/run_baseline.sh
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bench/results/*.md
          if git diff --cached --quiet; then
            echo "No baseline result changes"
            exit 0
          fi
          git commit -m "update nightly baseline $(date +%F)"
          git push
