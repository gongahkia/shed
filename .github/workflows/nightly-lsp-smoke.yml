name: Nightly LSP Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "45 7 * * *"

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  smoke:
    runs-on: macos-14
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: swift
            install: "true"
          - language: typescript
            install: "npm install -g typescript typescript-language-server"
          - language: javascript
            install: "npm install -g typescript typescript-language-server"
          - language: rust
            install: "brew install rust-analyzer"
          - language: python
            install: "npm install -g pyright"
          - language: go
            install: "brew install go gopls"
          - language: c
            install: |
              brew install llvm
              echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          - language: cpp
            install: |
              brew install llvm
              echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          - language: zig
            install: "brew install zls"
          - language: elixir
            install: "brew install elixir-ls"
          - language: kotlin
            install: "brew install fwcd/kotlin-language-server/kotlin-language-server"
          - language: csharp
            install: "brew install omnisharp"
          - language: bash
            install: "npm install -g bash-language-server"
          - language: dockerfile
            install: "npm install -g dockerfile-language-server-nodejs"
          - language: sql
            install: |
              brew install go
              go install github.com/sqls-server/sqls@latest
              echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          - language: dart
            install: "brew install dart-sdk"
          - language: haskell
            install: "brew install haskell-language-server"
          - language: lua
            install: "brew install lua-language-server"
          - language: ruby
            install: "gem install ruby-lsp"
          - language: terraform
            install: "brew install terraform-ls"
          - language: html
            install: "npm install -g vscode-langservers-extracted"
          - language: css
            install: "npm install -g vscode-langservers-extracted"
          - language: json
            install: "npm install -g vscode-langservers-extracted"
    steps:
      - uses: actions/checkout@v4
      - name: Install server
        run: |
          set +e
          bash -eo pipefail <<< '${{ matrix.install }}'
          status=$?
          set -e
          if [[ "$status" -ne 0 ]]; then
            echo "install failed for ${{ matrix.language }}; smoke may report skip"
          fi
      - name: Run smoke
        run: bench/scripts/lsp_smoke.sh --only "${{ matrix.language }}" --json "bench/results/lsp-smoke-${{ matrix.language }}.json"
      - name: Upload smoke result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lsp-smoke-${{ matrix.language }}
          if-no-files-found: error
          path: bench/results/lsp-smoke-${{ matrix.language }}.json

  aggregate:
    runs-on: macos-14
    needs: smoke
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set result date
        run: echo "SMOKE_DATE=$(date +%F)" >> "$GITHUB_ENV"
      - name: Download smoke results
        uses: actions/download-artifact@v4
        with:
          pattern: lsp-smoke-*
          merge-multiple: true
          path: bench/results/lsp-smoke-parts
      - name: Merge and gate results
        run: |
          current="bench/results/lsp-smoke-$SMOKE_DATE.json"
          previous="$(find bench/results -maxdepth 1 -name 'lsp-smoke-*.json' ! -name "lsp-smoke-$SMOKE_DATE.json" | sort | tail -1 || true)"
          args=(--output "$current")
          if [[ -n "$previous" ]]; then
            args+=(--previous "$previous")
          fi
          bench/scripts/lsp_smoke_merge.rb "${args[@]}" bench/results/lsp-smoke-parts/*.json
      - name: Upload merged smoke result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lsp-smoke-${{ env.SMOKE_DATE }}
          if-no-files-found: warn
          path: bench/results/lsp-smoke-${{ env.SMOKE_DATE }}.json
      - name: Commit smoke result
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "bench/results/lsp-smoke-$SMOKE_DATE.json"
          if git diff --cached --quiet; then
            echo "No LSP smoke result changes"
            exit 0
          fi
          git commit -m "update lsp smoke $SMOKE_DATE"
          git pull --rebase --autostash
          git push
