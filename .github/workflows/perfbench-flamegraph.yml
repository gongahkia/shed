name: PerfBench Flamegraph

on:
  pull_request:
    paths:
      - "Package.swift"
      - "Sources/PerfBench/**"
      - "Sources/ollyCore/**"
      - "Sources/ollyKit/**"
      - "Sources/ollyLayouts/**"
      - "scripts/profile.tracetemplate"
      - "scripts/capture-perfbench-flamegraph.sh"

permissions:
  contents: read

jobs:
  perfbench-flamegraph:
    name: Capture PerfBench flamegraph
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Capture flamegraph trace
        env:
          PERFBENCH_FLAMEGRAPH_ITERATIONS: 80
          PERFBENCH_FLAMEGRAPH_WINDOWS: 50
          PERFBENCH_FLAMEGRAPH_SOAK_EVENTS: 5000
          PERFBENCH_FLAMEGRAPH_TIME_LIMIT: 15s
        run: scripts/capture-perfbench-flamegraph.sh "$RUNNER_TEMP/perfbench-flamegraph"

      - name: Upload flamegraph artifacts
        uses: actions/upload-artifact@v4
        with:
          name: perfbench-flamegraph
          path: ${{ runner.temp }}/perfbench-flamegraph
          if-no-files-found: error
