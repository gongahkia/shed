name: PerfBench

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - ".perf-baseline.json"
  pull_request:

permissions:
  contents: read

jobs:
  perfbench-pr:
    name: PerfBench p95 regression
    if: github.event_name == 'pull_request'
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run PerfBench
        run: swift run -c release PerfBench --fail-on-budget --output "$RUNNER_TEMP/perfbench.json"

      - name: Load base baseline
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=1
          git show "FETCH_HEAD:.perf-baseline.json" > "$RUNNER_TEMP/perf-baseline.json"

      - name: Check p95 regression
        run: scripts/check-perfbench-regression.rb --threshold 0.10 "$RUNNER_TEMP/perf-baseline.json" "$RUNNER_TEMP/perfbench.json"

      - name: Upload PerfBench report
        uses: actions/upload-artifact@v4
        with:
          name: perfbench
          path: ${{ runner.temp }}/perfbench.json
          if-no-files-found: error

  perfbench-main:
    name: Refresh PerfBench baseline
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run PerfBench
        run: swift run -c release PerfBench --fail-on-budget --output "$RUNNER_TEMP/perfbench.json"

      - name: Upload PerfBench report
        uses: actions/upload-artifact@v4
        with:
          name: perfbench
          path: ${{ runner.temp }}/perfbench.json
          if-no-files-found: error

      - name: Update main baseline
        run: |
          cp "$RUNNER_TEMP/perfbench.json" .perf-baseline.json
          if git diff --quiet -- .perf-baseline.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .perf-baseline.json
          git commit -m "Update PerfBench baseline [skip ci]"
          git push
