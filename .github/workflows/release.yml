name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Verify native dependencies
        run: scripts/verify_native_dependencies.sh
      - name: Install packaging tools
        run: brew install create-dmg
      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          : "${CERTIFICATE_BASE64:?missing DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64}"
          : "${CERTIFICATE_PASSWORD:?missing DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD}"
          : "${KEYCHAIN_PASSWORD:?missing KEYCHAIN_PASSWORD}"
          keychain="$RUNNER_TEMP/itsy-signing.keychain-db"
          cert_path="$RUNNER_TEMP/developer-id.p12"
          echo "$CERTIFICATE_BASE64" | base64 -D > "$cert_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$cert_path" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$keychain" login.keychain-db
          security default-keychain -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security find-identity -v -p codesigning "$keychain"
      - name: Test
        run: scripts/test.sh
      - name: Build app
        env:
          ITSY_SPARKLE_PUBLIC_ED_KEY: ${{ vars.ITSY_SPARKLE_PUBLIC_ED_KEY }}
          ITSY_LSP_CATALOG_PUBLIC_ED_KEY: ${{ vars.ITSY_LSP_CATALOG_PUBLIC_ED_KEY }}
        run: |
          : "${ITSY_LSP_CATALOG_PUBLIC_ED_KEY:?missing ITSY_LSP_CATALOG_PUBLIC_ED_KEY}"
          export ITSY_LSP_CATALOG_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/lsp-catalog.json"
          swift build -c release
          bench/scripts/make_app.sh
      - name: Verify tag version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Itsy.app/Contents/Info.plist)"
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Extract versioned release notes
        run: |
          set -euo pipefail
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Itsy.app/Contents/Info.plist)"
          release_tag="${GITHUB_REF_NAME:-v$version}"
          case "$release_tag" in
            v*) ;;
            *) release_tag="v$version" ;;
          esac
          scripts/extract_release_notes.sh "$release_tag" "dist/release-notes/Itsy-$version.md"
      - name: Release prerequisite check
        env:
          ITSY_CODESIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION_IDENTITY }}
          ITSY_NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          ITSY_NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ITSY_NOTARY_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: scripts/release_doctor.sh
      - name: Sign app
        env:
          ITSY_CODESIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION_IDENTITY }}
        run: scripts/codesign.sh
      - name: Build DMG
        env:
          ITSY_CODESIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION_IDENTITY }}
        run: scripts/make_dmg.sh
      - name: Notarize and staple
        env:
          ITSY_NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          ITSY_NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ITSY_NOTARY_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: scripts/notarize.sh
      - name: Generate Sparkle appcast and cask
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_REQUIRE_ED_KEY: "1"
          ITSY_LSP_CATALOG_PRIVATE_KEY: ${{ secrets.ITSY_LSP_CATALOG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Itsy.app/Contents/Info.plist)"
          release_tag="${GITHUB_REF_NAME:-v$version}"
          case "$release_tag" in
            v*) ;;
            *) release_tag="v$version" ;;
          esac
          SPARKLE_DOWNLOAD_URL_PREFIX="https://github.com/${GITHUB_REPOSITORY}/releases/download/$release_tag/" SPARKLE_RELEASE_NOTES_PATH="dist/release-notes/Itsy-$version.md" SPARKLE_REQUIRE_RELEASE_NOTES=1 ITSY_LSP_CATALOG_SOURCE_PATH="docs/lsp-catalog.json" scripts/make_appcast.sh
          ITSY_RELEASE_TAG="$release_tag" scripts/make_homebrew_cask.sh
      - name: Verify release assets
        run: |
          set -euo pipefail
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Itsy.app/Contents/Info.plist)"
          test "$(find dist -maxdepth 1 -name '*.dmg' | wc -l | tr -d ' ')" = "1"
          test "$(find dist -maxdepth 1 -name '*.sha256' | wc -l | tr -d ' ')" = "1"
          test -f dist/sparkle/appcast.xml
          test -f "dist/sparkle/Itsy-$version.md"
          test -f dist/sparkle/lsp-catalog.json
          test -f dist/itsy.rb
          shasum -c dist/*.sha256
          scripts/verify_dmg.sh dist/*.dmg
          ruby -c dist/itsy.rb
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Itsy DMG
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.sha256
            dist/*.rb
            dist/sparkle/*.xml
            dist/sparkle/*.md
            dist/sparkle/lsp-catalog.json
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Itsy.app/Contents/Info.plist)"
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.sha256 dist/*.rb dist/sparkle/*.xml dist/sparkle/*.md dist/sparkle/lsp-catalog.json --verify-tag --title "$GITHUB_REF_NAME" --notes-file "dist/release-notes/Itsy-$version.md"
