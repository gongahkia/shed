name: Soak

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  soak:
    name: 7-day virtual soak
    if: github.event_name == 'workflow_dispatch' || vars.OLLY_ENABLE_SELF_HOSTED_SOAK == '1'
    runs-on:
      - self-hosted
      - macOS
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run soak harness
        run: |
          swift run -c release SoakHarness \
            --days 7 \
            --events-per-day 5000 \
            --sample-interval-seconds 600 \
            --max-growth-percent 5 \
            --output "$RUNNER_TEMP/soak.json"

      - name: Upload soak report
        uses: actions/upload-artifact@v4
        with:
          name: soak
          path: ${{ runner.temp }}/soak.json
          if-no-files-found: error
