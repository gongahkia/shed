[mode.normal]
"h" = "editor.moveLeft"
"j" = "editor.moveDown"
"k" = "editor.moveUp"
"l" = "editor.moveRight"
"w" = "editor.moveWordForward"
"Shift-W" = "editor.moveBigWordForward"
"b" = "editor.moveWordBackward"
