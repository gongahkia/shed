"Shift-P" = "vim.pasteBefore"
"v" = "vim.visual.char"
"Shift-V" = "vim.visual.line"
"Ctrl-V" = "vim.visual.block"
"Shift-;" = "vim.ex.start"
"i" = "mode.insert"
"/" = "edit.find"

[mode.visual]
