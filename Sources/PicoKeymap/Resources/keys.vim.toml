"a Shift-[" = "vim.textObject.aroundBrace"
"ip" = "vim.textObject.innerParagraph"
"ap" = "vim.textObject.aroundParagraph"

[mode.insert]
"Esc" = "mode.normal"
"jk" = "mode.normal"
